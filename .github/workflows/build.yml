name: build

on:
  push:
    branches:
        - main
    tags:
      - 'v*'
  pull_request:
    branches:
        - main
  workflow_dispatch:
    branches:
        - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: coursier/cache-action@v8
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      run: sbt test

  publish:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')}}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: coursier/cache-action@v8
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Publish library
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: sbt "+publish"
